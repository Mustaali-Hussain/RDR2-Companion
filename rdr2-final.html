body{font-family:var(--ff);background:var(--bg);color:var(--tx);line-height:1.55;min-height:100vh;overflow-x:hidden}

.val{font-size:11px;color:var(--tx)}
.tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;margin:1px 2px;font-weight:600}
.tag-r{background:rgba(148,56,56,.2);color:#d06060;border:1px solid rgba(148,56,56,.3)}
.tag-g{background:rgba(74,128,64,.2);color:#70b060;border:1px solid rgba(74,128,64,.3)}
.tag-b{background:rgba(58,104,136,.2);color:#60a0d0;border:1px solid rgba(58,104,136,.3)}
.tag-y{background:rgba(200,150,58,.15);color:var(--ac3);border:1px solid rgba(200,150,58,.3)}
.tag-p{background:rgba(140,100,180,.15);color:#b090d0;border:1px solid rgba(140,100,180,.3)}
.sbar{display:flex;align-items:center;gap:6px;margin:2px 0;font-size:10px}
.sbar-l{width:70px;color:var(--tx2);flex-shrink:0;text-align:right;font-size:9px;font-weight:600}
.sbar-t{flex:1;height:6px;background:var(--brd);border-radius:3px;overflow:hidden;max-width:140px}

.sbox{width:100%;padding:8px 10px;font-family:var(--ff);font-size:12px;background:var(--bg3);color:var(--tx);border:1px solid var(--brd);border-radius:var(--rad);outline:none;margin-bottom:10px}
.sbox:focus{border-color:var(--ac2)}.sbox::placeholder{color:var(--tx3)}
.btn{font-family:var(--ff);font-size:10px;font-weight:600;padding:4px 10px;border-radius:var(--rad);border:1px solid var(--brd);background:var(--bg3);color:var(--tx2);cursor:pointer}

.flex-bar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}

@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}.logo{font-size:15px}.nb{font-size:10px;padding:5px 8px}.row{flex-direction:column;gap:4px}}

<div id="pg-weapons" class="pg"></div>
<div id="pg-animals" class="pg"></div>

<div id="pg-plants" class="pg"></div>

<script>
// NAV
document.querySelectorAll('.nb').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nb').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));document.getElementById('pg-'+b.dataset.p).classList.add('on')}));
let CK={};
let openGroups=new Set();

// ====== BULLETPROOF SAVE SYSTEM ======
// Encodes all 661 checkboxes into ~120 character code

// Build ordered key list from TD for consistent bit positions
function getAllKeys(){
const keys=[];
for(const[g,items]of Object.entries(TD)){
for(const i of items){keys.push(g+'|'+i)}
}
return keys;
}

// Encode progress → short string
function encodeProgress(){
const keys=getAllKeys();
const bits=[];
for(const k of keys){bits.push(CK[k]?1:0)}
// Pack bits into bytes
const bytes=[];
for(let i=0;i<bits.length;i+=8){
let byte=0;
for(let b=0;b<8&&i+b<bits.length;b++){
if(bits[i+b])byte|=(1<<b);
}
bytes.push(byte);
}
// Base64 encode
const arr=new Uint8Array(bytes);
let bin='';for(const b of arr)bin+=String.fromCharCode(b);
return 'RDR2:'+btoa(bin);
}

// Decode string → progress
function decodeProgress(code){
try{
if(!code.startsWith('RDR2:'))return null;
const b64=code.substring(5);
const bin=atob(b64);
const bytes=[];
for(let i=0;i<bin.length;i++)bytes.push(bin.charCodeAt(i));
// Unpack bits
const keys=getAllKeys();
const result={};
for(let i=0;i<keys.length;i++){
const byteIdx=Math.floor(i/8);
const bitIdx=i%8;
if(byteIdx<bytes.length&&(bytes[byteIdx]&(1<<bitIdx))){
result[keys[i]]=true;
}
}
return result;
}catch(e){return null}
}

// Save to ALL available storage
function sv(){
// Save to ALL available storage methods
const data=JSON.stringify(CK);
try{localStorage.setItem('rdr2t',data)}catch(e){}
// Cookie (most persistent on iOS — 400 day max)
try{
const encoded=encodeProgress();
document.cookie='rdr2='+encodeURIComponent(encoded)+';max-age=34560000;path=/;SameSite=Lax';
}catch(e){}
// IndexedDB
try{
const r=indexedDB.open('rdr2c',1);
r.onupgradeneeded=()=>r.result.createObjectStore('d');
r.onsuccess=()=>{
const tx=r.result.transaction('d','readwrite');
tx.objectStore('d').put(data,'p');
r.result.close();
};
}catch(e){}
tryCloudSave();
}

// Cloud save (best-effort)
let _db=null;
let _csTimer=null;
function tryCloudSave(){
if(_csTimer)clearTimeout(_csTimer);
_csTimer=setTimeout(async()=>{
try{
if(!_db&&typeof window.claude!=='undefined'&&window.claude.use){
_db=await window.claude.use('db');
}
if(_db){
await _db.doc('data/users/me/rdr2_save').set({p:JSON.stringify(CK),t:Date.now()});
showSyncStatus('☁️');
}
}catch(e){}
},1500);
}

// Load from best available source
async function loadProgress(){
let best=CK;let bestCount=Object.keys(CK).length;
// 1. IndexedDB
try{
await new Promise((res)=>{
const r=indexedDB.open('rdr2c',1);
r.onupgradeneeded=()=>r.result.createObjectStore('d');
r.onsuccess=()=>{
try{
const tx=r.result.transaction('d','readonly');
const req=tx.objectStore('d').get('p');
req.onsuccess=()=>{
if(req.result){const d=JSON.parse(req.result);const c=Object.keys(d).length;if(c>bestCount){best=d;bestCount=c}}
r.result.close();res();
};req.onerror=()=>{r.result.close();res()};
}catch(e){r.result.close();res()}
};r.onerror=()=>res();
});
}catch(e){}
// 2. Cloud
try{
if(typeof window.claude!=='undefined'&&window.claude.use){
_db=await window.claude.use('db');
if(_db){
const snap=await _db.doc('data/users/me/rdr2_save').get();
if(snap.exists){const d=JSON.parse(snap.data().p||'{}');const c=Object.keys(d).length;if(c>bestCount){best=d;bestCount=c}}
showSyncStatus('☁️');
}
}
}catch(e){}
if(bestCount>Object.keys(CK).length){CK=best;sv()}
}

// === SAVE CODE UI ===
function showSaveCode(){
const code=encodeProgress();
const count=Object.keys(CK).filter(k=>CK[k]).length;
const el=document.getElementById('save-code-area');
el.innerHTML=`
<div style="padding:12px;background:var(--c2);border-radius:8px;margin:8px 0">
<p style="margin:0 0 8px;font-size:12px;color:var(--t2)"><strong>${count} items checked.</strong> Copy code below and save in Notes app:</p>
<textarea id="save-code-text" readonly style="width:100%;height:60px;font-size:11px;font-family:monospace;background:var(--bg);color:var(--t1);border:1px solid var(--brd);border-radius:4px;padding:8px;resize:none">${code}</textarea>
<button class="btn" onclick="copySaveCode()" style="margin-top:6px;width:100%;padding:8px;font-size:13px;font-weight:bold">📋 TAP TO COPY CODE</button>
<p id="copy-confirm" style="margin:4px 0 0;font-size:11px;color:var(--gn);text-align:center"></p>
</div>`;
// Auto-select
setTimeout(()=>{const ta=document.getElementById('save-code-text');if(ta){ta.select();ta.focus()}},100);
}

function copySaveCode(){
const ta=document.getElementById('save-code-text');
if(!ta)return;
ta.select();
ta.setSelectionRange(0,99999);
try{
navigator.clipboard.writeText(ta.value).then(()=>{
document.getElementById('copy-confirm').textContent='✅ Copied! Paste this into your Notes app.';
}).catch(()=>{
document.execCommand('copy');
document.getElementById('copy-confirm').textContent='✅ Copied! Paste this into your Notes app.';
});
}catch(e){
document.execCommand('copy');
document.getElementById('copy-confirm').textContent='✅ Copied! Paste this into your Notes app.';
}
}

function showLoadCode(){
const el=document.getElementById('save-code-area');
el.innerHTML=`
<div style="padding:12px;background:var(--c2);border-radius:8px;margin:8px 0">
<p style="margin:0 0 8px;font-size:12px;color:var(--t2)">Paste your save code from Notes:</p>
<textarea id="load-code-text" placeholder="Paste RDR2:... code here" style="width:100%;height:60px;font-size:11px;font-family:monospace;background:var(--bg);color:var(--t1);border:1px solid var(--brd);border-radius:4px;padding:8px;resize:none"></textarea>
<button class="btn" onclick="doLoadCode()" style="margin-top:6px;width:100%;padding:8px;font-size:13px;font-weight:bold">📥 RESTORE PROGRESS</button>
<p id="load-confirm" style="margin:4px 0 0;font-size:11px;text-align:center"></p>
</div>`;
}

function doLoadCode(){
const ta=document.getElementById('load-code-text');
if(!ta||!ta.value.trim())return;
const result=decodeProgress(ta.value.trim());
if(result){
const count=Object.keys(result).filter(k=>result[k]).length;
CK=result;sv();rT();
document.getElementById('load-confirm').textContent='✅ Restored '+count+' items!';
document.getElementById('load-confirm').style.color='var(--gn)';
}else{
document.getElementById('load-confirm').textContent='❌ Invalid code. Make sure you copied the full RDR2:... string.';
document.getElementById('load-confirm').style.color='#e55';
}
}

function showSyncStatus(msg){const el=document.getElementById('sync-status');if(el)el.textContent=msg}

// Initial load — try every source, use whichever has the most data
function bestLoad(){
let best={};let bestCount=0;
// 1. localStorage
try{const d=JSON.parse(localStorage.getItem('rdr2t')||'{}');const c=Object.keys(d).length;if(c>bestCount){best=d;bestCount=c}}catch(e){}
// 2. Cookie
try{
const match=document.cookie.match(/rdr2=([^;]+)/);
if(match){const code=decodeURIComponent(match[1]);const d=decodeProgress(code);if(d){const c=Object.keys(d).length;if(c>bestCount){best=d;bestCount=c}}}
}catch(e){}
return best;
}
CK=bestLoad();
function esc(s){return s.replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function escJ(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"')}
function sbar(l,v,mx,c){return`<div class="sbar"><span class="sbar-l">${l}</span><div class="sbar-t"><div class="sbar-f" style="width:${v/mx*100}%;background:${c}"></div></div><span class="sbar-v">${v}/${mx}</span></div>`}
function om(t,b){const m=document.getElementById('mdl');m.innerHTML=`<button class="mx" onclick="cm()">&times;</button><h3>${t}</h3><div class="gd" style="margin-top:10px">${b}</div>`;document.getElementById('mbg').classList.add('on');document.body.style.overflow='hidden'}
function cm(){document.getElementById('mbg').classList.remove('on');document.body.style.overflow=''}

// ===== ALL 178 ANIMALS =====
const AN=[
// Reptiles & Amphibians
{n:"American Alligator",sz:"L",i:"🐊",loc:"Bayou Nwa, Bluewater Marsh, Lakay — Lemoyne swamps",wp:"Rifle + express or improved arrows",dr:"Big Game Meat ×3, Alligator Skin, Alligator Teeth",u:"Skin → Trapper outfits (Ranch Cutter Saddle). Teeth → Fence talismans. Dangerous — lunges from water."},
{n:"American Alligator (Small)",sz:"M",i:"🐊",loc:"Bayou Nwa, Bluewater Marsh — shallow swamp",wp:"Repeater or Bow + poison arrow",dr:"Herptile Meat, Small Alligator Skin",u:"Skin → Trapper. Smaller and less aggressive than adults."},
{n:"Alligator Snapping Turtle",sz:"S",i:"🐢",loc:"Bayou Nwa, Bluewater Marsh — shallow water",wp:"Varmint Rifle",dr:"Herptile Meat, Turtle Shell",u:"Shell → Trapper crafting. Found in shallow swamp water."},
{n:"Banded Gila Monster",sz:"S",i:"🦎",loc:"New Austin — desert rocks, dry riverbeds. Epilogue only",wp:"Varmint Rifle",dr:"Herptile Meat, Gila Monster Skin",u:"Skin → Trapper. Venomous. Only in New Austin."},
{n:"Desert Iguana",sz:"S",i:"🦎",loc:"New Austin — desert. Epilogue only",wp:"Varmint Rifle",dr:"Herptile Meat, Iguana Skin",u:"Skin → Trapper outfits."},
{n:"Green Iguana",sz:"S",i:"🦎",loc:"Guarma only (Ch5)",wp:"Varmint Rifle",dr:"Herptile Meat, Iguana Skin",u:"Skin → Trapper. Guarma exclusive — pick up in Ch5."},
{n:"American Bullfrog",sz:"S",i:"🐸",loc:"Rivers, lakes, swamps — near water throughout",wp:"Small Game Arrows",dr:"Carcass only",u:"Carcass → Pearson. Good for Survivalist 7 (consecutive arrow kills)."},

G("Part I:","Exotics Part I for Algernon Wasp. Need 5 each of Snowy, Little, and Reddish Egret Plumes (shoot egrets with Varmint Rifle in Bayou Nwa) plus 15 Lady of the Night Orchids (tree branches in Bayou Nwa). Egrets are near water in swamps.");
G("Part II:","Exotics Part II. 20 Heron Plumes (Great Blue and Tricolored Herons in Bayou Nwa), 7 Lady Slipper Orchids (ground level in Roanoke Ridge forests), 10 Moccasin Flower Orchids (damp forest floors). Plumes require MANY herons.");
G("Part III:","Exotics Part III. 25 Gator Eggs (search alligator nests in Bayou Nwa — small mound nests near water), 3 Acuna's Star Orchids, 7 Cigar Orchids, 5 Ghost Orchids (all on tree branches/trunks in Bayou Nwa). Ghost Orchids are rare.");
G("Part IV:","Exotics Part IV. 30 Roseate Spoonbill Plumes (pink birds — very rare, Bayou Nwa shorelines), 5 Night Scented + 5 Rat Tail + 5 Spider Orchids (tree branches in Bayou Nwa). Spoonbills are the bottleneck — they're uncommon.");
G("Part V:","Exotics Part V (final). 5 Clamshell + 5 Dragon's Mouth + 5 Queen's + 10 Sparrow Egg Orchids. All from trees in Bayou Nwa and Roanoke Ridge. After completing, Algernon gives his unique gold revolver as a reward.");
// Hunting Requests
G("Req 1:","Hunting Request 1: Deliver Perfect Squirrel Carcass (Bow + Small Game Arrow) and Perfect Rabbit Carcass (Varmint Rifle). WHOLE carcasses only — do NOT skin them. Post to the mail from any post office.");
G("Req 2:","Hunting Request 2: Perfect Cardinal + Rat + Woodpecker carcasses. All require Small Game Arrows for perfect quality. Cardinals in forests, Rats in cities/mines, Woodpeckers on tree trunks.");
G("Req 3:","Hunting Request 3: Perfect Chipmunk (Small Game Arrow) + Opossum (Varmint Rifle) + Oriole (Small Game Arrow) + Robin (Small Game Arrow) carcasses. Orioles in forests, Robins everywhere.");
G("Req 4:","Hunting Request 4: Perfect Songbird + Sparrow + Toad + Bullfrog + Skunk carcasses. Songbirds and Sparrows need Small Game Arrows. Toads and Bullfrogs near water (Small Game Arrow). Skunk at night (Varmint Rifle).");
G("Req 5:","Hunting Request 5 (final): Perfect Cedar Waxwing + Bat + Blue Jay + Crow + Beaver carcasses. Waxwing/Blue Jay in forests (Small Game Arrow). Bat at caves at dusk (Small Game Arrow — very tricky). Crow everywhere. Beaver at Owanjila (Varmint Rifle).");

// Compendium
G("Animals: study","Study, track, and kill at least 50 different animal species. Use binoculars to study, Eagle Eye to track, then make the kill.");

G("Fish: catch","Catch at least 10 different fish species. Use appropriate bait/lures for each.");

// Random encounters
G("Encounter ","Track unique random encounters you come across. These include roadside rescues, ambushes, stranger events, and emergent situations. Note what each one was in the item description. You need at least 25 unique encounters for 100%.");

// STRANGERS - all 29
G("A Bright Bouncing Boy (Marko Dragic)","Multi-part mission near Saint Denis docks. Part I: help Dragic with a remote-controlled boat demonstration. Part II: assist at his lab in Doverhill with his creation. After completing, visit Colter later — the robot wanders in the mountains. Interacting yields a unique item.");
G("A Fine Night For It","Triggered after encountering Night Folk in Bayou Nwa at night. A man in the swamps asks for help with the Night Folk. Combat-heavy — bring shotgun and Dead Eye tonics. Stay alert near Lagras.");
G("A Fisher of Fish","Meet Jeremy Gill at his lakeside cabin. He tasks you with catching all 13 legendary fish using Special Lures (buy from bait shop after meeting him). Mail each legendary fish from a post office. The final fish (Channel Catfish) is uncatchable — the mission completes anyway with a cutscene.");
G("A Test of Faith","Find all 30 dinosaur bones for paleontologist Deborah MacGuiness. Bones are embedded in cliffs and rock faces across the map. Use Eagle Eye to spot them. Inspect each with binoculars or camera. Mail discoveries from post offices. After all 30, visit her for the reward.");
G("All That Glitters","Meet a stranger near Annesburg who wants you to collect gold from a crashed stagecoach. Multi-part, involves returning to the location and making choices about sharing the gold.");
G("American Dreams","Find 3 serial killer clue scenes, assemble a map, investigate Lucky's Cabin SW of Valentine. Scene 1: SW of Wallace Station. Scene 2: under bridge S of Valentine. Scene 3: E of Braithwaite Manor. Inspect head at each scene for map piece. Hogtie suspect and take to Valentine Sheriff.");
G("Arcadia for Amateurs (Albert Mason)","Help wildlife photographer Albert Mason across 5 encounters in different regions. Protect him from animals while he photographs. Locations: near Flat Iron Lake, Heartlands, Big Valley, Roanoke Ridge, Grizzlies. Complete before Chapter 6.");
G("Duchesses and Other Animals","Collect exotic items (orchids, bird plumes, egret feathers, gator eggs) for Algernon Wasp in Saint Denis. 5 parts with extensive collecting. Very time-consuming. Requires orchids from tree branches in Bayou Nwa and plumes from herons/egrets/spoonbills. Reward: Algernon's unique gold revolver.");
G("Fools Gold","A man in a suit of golden armor near Flatneck Station. Help him or watch the situation unfold. Short, humorous encounter.");
G("Fundraiser","Donation encounter — a woman collecting funds in Saint Denis. Donate money to complete. Multiple encounters possible.");
G("Geology for Beginners","Find 10 rock carvings for Francis Sinclair. Carvings are on cliff faces. Use binoculars or camera to inspect. Locations: Owanjila, Mount Shann, Flatneck, Horseshoe, Cumberland, Bacchus Station, Moonstone Pond, Elysian Pool, Roanoke, Whinyard Strait. Return to Sinclair's cabin after all 10.");
G("He's British, Of Course","Multi-part mission with an eccentric British explorer. Help him with his expeditions across the frontier. Encounters trigger at various locations between chapters.");
G("Help a Brother Out","Help Brother Dorkins in Saint Denis. Chapter 4. Simple mission involving assisting at the church. Leads to further missions with the monks.");
G("Idealism and Pragmatism for Beginners","Multi-part mission in Saint Denis involving political activism and public speaking. Meet the characters near the city center.");
G("No Good Deed","Encounter a stranger who needs help. Your choices affect the outcome. Can trigger in various locations. Standard help-or-ignore encounter.");
G("Of Men and Angels","Two-part stranger mission with Sister Calderón in Saint Denis. Part I and II involve conversations about faith and redemption. Honor-sensitive — requires decent honor to trigger.");
G("Oh, Brother","Three brothers performing increasingly dangerous stunts. Encounter them at various locations. Watch or participate in their antics. Multi-part comedy encounters.");
G("Smoking and Other Hobbies","Collect and mail cigarette card sets. Visit any general store to buy Premium Cigarettes (random cards inside). Complete sets of 12 and mail them from post offices for rewards. Buy in bulk for fastest collecting.");
G("The American Inferno, Burnt Out","Help a writer with his alcoholism. Find him at various saloons across the map. Multi-part — each encounter involves a different bar. Help him or enable his drinking.");
G("The Artist's Way (Charles Chatenay)","Help the French artist Charles Chatenay in Saint Denis. Four parts involving his art, scandals, and escape plans. Humorous mission chain.");
G("The Course of True Love (Penelope & Beau)","Help star-crossed lovers from the Gray and Braithwaite families. Multiple parts across Chapters 2-6. Romance storyline amid the family feud.");
G("The Iniquities of History","Help an author in Saint Denis research a historical wrong. Involves visiting locations and gathering information.");
G("The Mercies of Knowledge","Multi-part mission involving a professor and his experiments. Encounters in Saint Denis. Three parts with increasingly strange science.");
G("The Noblest of Men, and a Woman","Track down famous gunslingers for biographer Theodore Levin. Visit each: Emmet Granger (pig farm), Flaco Hernández (mountain cabin), Billy Midnight (train), Black Belle (swamp). Duel each one. Loot their unique named weapons — excellent guns.");
G("The Smell of the Grease Paint","Help traveling showwoman Miss Marjorie with her performances. Three parts at different locations. Theater-related missions.");
G("The Ties That Bind Us","Help two prisoners — a chain gang encounter. Multiple parts. Find them on roads and help them escape or turn them in.");
G("The Veteran (Hamish Sinclair)","Four-part mission at O'Creagh's Run. Fishing, hunting, horse-breaking with Civil War veteran Hamish. Heartfelt side story. After the final part, you can take his horse Buell — an excellent Dutch Warmblood.");
G("The Widow (Charlotte Balfour)","Three parts north of Annesburg. Teach Charlotte to hunt and survive after her husband's death. One of the most touching side stories. Complete all 3 parts before Chapter 6 ends.");
G("The Wisdom of the Elders","Encounter near the Wapiti reservation. Involves conversations about Native American history and the conflict with the government. Ties into Rains Fall's story.");
// ALL BANDIT CHALLENGES with new names
G("1: Hold up 5 townsfolk","Wait until night, wear a bandana. Target isolated NPCs in towns — drunk NPCs leaving saloons are slowest to react. Press the rob prompt with weapon drawn. Flee before witnesses report. Easiest at night in small towns like Valentine or Strawberry.");
G("2: Rob 2 coaches or return 2 stolen to fence","Find stagecoaches on roads (common between Valentine and Emerald Ranch). Rob them by threatening the driver, OR steal covered wagons and drive them to the Emerald Ranch fence. Only covered wagons count for the fence option.");
G("3: Rob 4 shop registers in one day","Enter 4 different shops (general store, gunsmith, doctor, tailor), aim weapon at shopkeeper, demand the register. Must be 4 different shops in one in-game day. Valentine, Strawberry, Rhodes, and Saint Denis cover it quickly. Pay your bounty afterward.");
G("4: Rob 3 coaches in one day or sell 3 stolen","Same as Bandit 2 but 3 in one day. Wait at road crossroads for coaches. Or steal 3 covered wagons and sell to Emerald Ranch fence. Space between towns to find enough traffic.");
G("5: Build $250 bounty in one state","Commit crimes in one state until your bounty hits $250. Fastest method: shoot lawmen in a town. The bounty stacks fast. DON'T pay it off until the challenge registers. Then pay it at the post office.");
G("6: Steal 5 horses, sell to horse fence","Steal horses from hitching posts or riders and sell to the Horse Fence at Clemens Cove (south of Rhodes). Saint Denis has many hitched horses. Steal, ride to fence, fast travel back, repeat.");
G("7: Rob $50 from townsfolk/travelers","Cumulative $50 from mugging NPCs. Well-dressed NPCs in Saint Denis carry $5-15 each. About 5-10 robberies to reach $50.");
G("8: Steal 7 wagons, sell to Emerald fence","Take covered wagons from NPC drivers on wilderness roads (not in towns). Drive them to the Emerald Ranch fence. Only covered wagons count. Main roads between towns have regular wagon traffic.");
G("9: Hogtie 3 people on railroad tracks","Lasso an NPC, hogtie them, pick them up, carry to railroad tracks, drop on rails. Repeat 3 times. Tracks near Flatneck Station are easily accessible. You don't need to wait for a train to hit them.");
G("10: Complete 5 train robberies without dying","Board moving trains, rob passengers car by car at gunpoint, dynamite the baggage car safe. Do 5 total without dying during any robbery. Generates huge bounties — spread across different states. Bring health tonics.");
// ALL EXPLORER
G("1: Find a treasure map","Buy from treasure hunter near Flatneck Station (Jack Hall Gang), or find on a cliff NE of Valentine (High Stakes), or at Cairn Lake (Poisonous Trail). Cheapest is buying at Flatneck.");
G("2: Find a treasure","Complete any treasure chain's first stage. Jack Hall Gang 1 leads to Caliban's Seat in the Heartlands. Follow the map illustration to match landmarks.");
G("3: Find a treasure","Complete another treasure stage. Each chain has 3-5 steps. Follow the drawn clues on each map carefully.");
G("4: Find a treasure","Another treasure found. Mix and match from different chains — Jack Hall Gang, High Stakes, Poisonous Trail, Landmarks of Riches, Elemental Trail.");
G("5: Find a treasure","Continue treasure hunting. Each discovery yields gold bars worth $500+ each.");
G("6: Find a treasure","More treasure. The Landmarks of Riches chain is the most valuable — 6 gold bars at the end.");
G("7: Find a treasure","Keep going. You're building wealth and crossing the map — good for exploring new areas.");
G("8: Find a treasure","Almost there. The Poisonous Trail ends in the Elysian Pool cave — bring a lantern.");
G("9: Find a treasure","One more. The Elemental Trail is epilogue-only (New Austin).");
G("10: Find a treasure","Final treasure. Complete all chains for maximum payout of 18+ gold bars ($9000+).");
// ALL GAMBLER
G("1: Win 5 hands of poker","Play at Flatneck Station, Valentine, Saint Denis, or camp. Play tight — fold bad hands, bet aggressively with pairs or better. Small buy-in tables at Flatneck are easiest.");
G("2: Double down and win 5 times","In blackjack at Rhodes or Van Horn, double down when you have 10 or 11 (best odds). You need to win 5 doubled hands total — not in a row. May take 20-30 minutes.");
G("3: Win 3 games of Five Finger Fillet","Play at Valentine saloon or camp. Watch button prompts carefully. Start slow — accuracy matters more than speed early. Camp opponents are easier. Memorize the pattern, it repeats.");
G("4: Bust out a poker opponent at 3 locations","Play poker at Flatneck Station, Saint Denis, AND Valentine. At each location, stay until you eliminate at least one opponent (they lose all chips). Play aggressively with strong hands to take their stack.");
G("5: Win 3 dominoes rounds (2 or fewer opponents, no draw)","Play at Emerald Station. You need 3 rounds won against 2 or fewer opponents without drawing any tiles. Block opponents strategically. If you draw a tile, that round doesn't count.");
G("6: Beat blackjack dealer in Rhodes and Van Horn","Win at least one hand of blackjack at both locations. Visit Rhodes first, win a hand, then go to Van Horn and win there too. Standard blackjack strategy — hit on 16 or below.");
G("7: Beat FFF player in Strawberry, Valentine, Van Horn","Beat the Five Finger Fillet player at all three locations. Each town has a different difficulty. Start with Valentine (easiest), then Strawberry, then Van Horn. Memorize button patterns.");
G("8: Win 3 blackjack hands after 3+ hits","Win 3 hands where you hit 3 or more times before standing. Very luck-dependent — you need to start with low cards. Bet minimum to preserve bankroll. Leave and rejoin to reset if needed. Can take 30+ minutes.");
G("9: Win 3 dominoes games in a row","Win 3 full games consecutively at Emerald Station (All Fives). If you lose any game, leave the table and sit back down to reset the streak counter. Play defensively — block opponents.");
G("10: Win 3 poker hands in a row","Win 3 consecutive poker hands. Play at small tables with 2-3 opponents. Fold to reset the streak tracker (folds don't count as losses). Go all-in with strong hands when the streak is active.");
// ALL HERBALIST
G("1: Pick 6 yarrow","Yarrow has yellow flowers. Abundant in Heartlands, Big Valley, Scarlett Meadows, and Great Plains. Ride through open meadows with Eagle Eye active — yarrow glows. Done in 5 minutes.");
G("2: Pick and eat 4 berry species","Eat 4 different berry types: Wintergreen Berry (Grizzlies/cold areas), Blackberry (Lemoyne), Evergreen Huckleberry (Tall Trees/Big Valley), Blackcurrant (Roanoke). Each grows in different biomes — visit all regions.");
G("3: Craft 7 items using sage","Common Sage grows in dry grasslands — Great Plains and New Austin. Pick plenty, then craft at a campfire: Potent Snake Oil and Special Snake Oil both use sage. Bulk-craft to hit 7 quickly.");
G("4: Pick 5 mushrooms, feed to horse","Find 5 mushrooms: Bay Bolete, Parasol, Chanterelle, Ram's Head. Roanoke Ridge forests are mushroom-rich. Walk slowly with Eagle Eye near large trees. After picking, open satchel and feed them to your horse.");
G("5: Craft 9 items with Indian Tobacco","Indian Tobacco is extremely common in Heartlands and Lemoyne fields — brown-leaved plant everywhere. Stock up 20+, then craft Potent Snake Oil (uses Indian Tobacco + Sage). Bulk-craft at any campfire.");
G("6: Pick 15 different herb species","Pick 15 unique species. Visit multiple biomes: plains (Yarrow, Prairie Poppy), forests (Ginseng, mushrooms), swamps (Oleander, orchids), mountains (Wintergreen Berry). Check compendium to track which you've found.");
G("7: Craft and use 5 Special Miracle Tonics","Requires the Special Miracle Tonic pamphlet (buy from Fence). Recipe: Yarrow + Indian Tobacco + Sage + Ginseng + Milkweed + Agarita. Agarita is only in New Austin — epilogue access needed. Craft 5, then USE each one.");
G("8: Use oleander to craft 6 poison weapons","Oleander Sage grows in Bayou Nwa swamps — pink flowers near water. Pick 6+, then craft Poison Arrows (Arrow + Flight Feather + Oleander Sage) or Poison Throwing Knives. Craft 6 total poison weapons.");
G("9: Pick one of each plant species (43)","Collect all 43 plant species. Requires visiting every biome including New Austin (epilogue) for Agarita, Red Sage, Desert Sage. Some orchids only grow on tree branches in Bayou Nwa — look up. Check compendium for missing species.");
G("10: Season and cook all 11 meat types","Cook every meat type × 3 seasonings. Meat types: Big Game, Venison, Pork, Poultry, Flaky Fish, Gritty Fish, Stringy Meat, Exotic Meat, Plump Bird, Game, Herptile. Seasonings: Oregano, Thyme, Mint. Hunt different animal categories and stock all 3 herbs.");
// ALL HORSEMAN
G("1: Kill 5 rabbits from horseback","Ride through meadows with a Varmint Rifle equipped. Rabbits are everywhere in the Heartlands. Use Dead Eye while riding to target them. Easy early challenge.");
G("2: Jump 3 obstacles in 15 seconds","Find 3 fences close together — the fenced fields near Emerald Ranch are perfect. Gallop and jump all 3 in a row. Must be actual jumps over obstacles, not flat ground.");
G("3: Valentine to Rhodes under 5:00","Fast horse required (Arabian or Fox Trotter ideal). Follow the main road south from Valentine through the Heartlands to Rhodes. Use cinematic camera and hold gallop. Should take ~4 minutes on a max-bond horse.");
G("4: Drag victim 3,300 ft with lasso","Lasso someone while mounted, then ride 3,300 feet dragging them. Open plains are best — avoid trees and rocks as the rope breaks on obstacles. Takes about 2 minutes of straight riding. Great Plains is ideal.");
G("5: Trample 5 animals","Ride through groups of small animals. Emerald Ranch chicken coops are the easiest — ride through the chickens repeatedly. Rabbits in meadows also work. Must physically ride over them.");
G("6: Strawberry to Saint Denis under 9:00 (no water)","Long ride requiring a fast horse at max bond. Follow main road south through Tall Trees, east through Great Plains, past Rhodes to Saint Denis. Cannot touch water — avoid rivers. Very tight on time.");
G("7: Kill 7 enemies from horseback without dismounting","Ride into a gang hideout (Hanging Dog Ranch, Six Point Cabin) with a repeater equipped. Use Dead Eye to chain kills from the saddle. Don't dismount until you've killed 7.");
G("8: Kill 9 predators from horseback","Kill 9 predators while riding. Wolves are best — ride through wolf territory in the Grizzlies or Big Valley at night. Wolves attack in packs of 3-5. Keep rifle equipped. Also works on cougars, bears, boars.");
G("9: Van Horn to Blackwater under 17:00 (no water)","Epilogue only (Blackwater access required). Best horse essential. Follow roads west from Van Horn, south through Heartlands, west through Great Plains to Blackwater. Cannot touch water. Arabian at max bond.");
G("10: Break every wild horse breed","Find and break every breed of wild horse. Breeds: American Paint, American Standardbred, Appaloosa, Hungarian Halfbred, Kentucky Saddler, Morgan, Mustang, Nokota, Tennessee Walker. Each spawns in specific areas.");
// ALL MASTER HUNTER
G("1: Skin 3 deer","Kill and skin 3 deer (whitetail or mule). Heartlands are full of deer. Use a rifle for clean kills. Easiest hunting challenge.");
G("2: Collect 3 perfect rabbit pelts","Find 3-star rabbits with binoculars. Kill each with a Varmint Rifle headshot. One clean shot = perfect pelt. Rabbits are everywhere in meadows and clearings.");
G("3: Track 10 species with binoculars","Study 10 different animal species through binoculars. Just look at each animal and press Study. Visit different biomes for variety — plains, forests, swamps each have unique species.");
G("4: Call and get a clean kill 5 times","Use the call button in the field to attract animals. When an animal responds and raises its head, shoot it for a clean kill. Works best with deer and pronghorn from cover.");
G("5: Skin 3 black/grizzly bears","Kill and skin 3 bears. Black bears in Roanoke Ridge forests (less dangerous). Grizzlies near Tall Trees. Use Bolt-Action Rifle + Express ammo. Wait near berry bushes at dawn. Headshot in Dead Eye.");
G("6: Kill 5 cougars with bow and skin them","Very difficult. Cougars charge fast and silently. Use improved arrows + Dead Eye. Spawn points: NW of Annesburg, west of Strawberry. Apply Potent Predator Bait + cover scent. Save before each attempt.");
G("7: Use bait to kill a herbivore and predator","Place herbivore bait in a meadow, kill the deer that comes. Then place predator bait nearby and kill the wolf/coyote. Big Valley is good for both types.");
G("8: Catch 3 fish without a rod","Use dynamite near shallow water — explosions kill multiple fish. Pick them up. Alternatively, use a bow with small game arrows on fish visible in very shallow water. Dynamite is by far the easiest method.");
G("9: Kill an opossum playing possum","Find an opossum at night (Roanoke Ridge, Lemoyne roads). Fire a warning shot NEAR it (not at it) to scare it into playing dead. Then kill it while it's faking. Not every opossum plays dead — try several.");
G("10: Track and kill the Legendary Panther","Requires Master Hunter 1-9 completed first. Spawns SE of Braithwaite Manor in dense forest. THE most dangerous animal. Enter the area with Dead Eye full, cover scent applied, rifle ready. The instant you see movement, enter Dead Eye and headshot. It kills in 2 hits.");
// ALL SHARPSHOOTER
G("1: Kill 3 flying birds","Shoot 3 birds while airborne. Use a shotgun for wider spread — much easier than a rifle. Or enter Dead Eye with auto-marking. Flush ducks from water and shoot as they take off.");

function getGuide(item,group){
if(GD[item])return GD[item];
for(const[k,v]of Object.entries(GD)){if(item.includes(k))return v}
// Chapter-level fallbacks
if(item.startsWith('Ch1:'))return"Chapter 1 tutorial mission in the Grizzlies. Follow objectives, loot everything. Gold medal: complete within time, get headshots, no health items.";
if(item.startsWith('Ch2:'))return"Chapter 2 mission. Full open world. Gold medals require headshots, time limits, and optional objectives. Check pause menu during replays.";
if(item.startsWith('Ch3:'))return"Chapter 3 Lemoyne mission. Gray–Braithwaite territory. Bring rifles and shotguns for combat.";
if(item.startsWith('Ch4:'))return"Chapter 4 Saint Denis mission. Urban close-quarters. Bring health tonics and Dead Eye refills.";
if(item.startsWith('Ch5:'))return"Chapter 5 Guarma. Linear, combat-heavy. Pick up unique items — can't return.";
if(item.startsWith('Ch6:'))return"Chapter 6 final chapter. Complete side content before the finale — some becomes unavailable.";
if(item.startsWith('Epi'))return"Epilogue mission as John Marston. After completion, full free roam with New Austin access.";
if(item.startsWith('DC '))return"Dreamcatcher hanging from a tree branch. Look up into tree canopies — they shimmer slightly. Use Eagle Eye to spot them.";
if(item.startsWith('Bone'))return"Dinosaur bone embedded in cliff face, hillside, or rock formation. Glows faintly. Use Eagle Eye to spot. Inspect with binoculars or camera. Mail discoveries to Deborah MacGuiness.";
if(group.includes('Cigarette'))return"Collect all 12 cards in this set. Buy Premium Cigarettes from general stores in bulk (random card per pack), or find individual cards in buildings. Mail completed sets from any post office.";
if(group.includes('Stolen Hats'))return"Saveable stolen hat. Knock it off an NPC's head, pick it up, and it saves to your wardrobe. Some are chapter-sensitive or location-specific.";
return"Check the in-game log for detailed requirements. Save before attempting difficult objectives.";}



// Smart checkbox toggle - update without full re-render
function toggleCheck(k,el){
if(el.checked)CK[k]=true;else delete CK[k];
sv();
// Update item styling
const ci=el.closest('.ci');
if(ci){ci.classList.toggle('done',el.checked)}
// Update group count and progress bar
const tg=el.closest('.tg');
if(tg){
const g=tg.getAttribute('data-g');
if(g&&TD[g]){
const items=TD[g];
const done=items.filter(i=>CK[g+'|'+i]).length;
const total=items.length;
const pct=total?Math.round(done/total*100):0;
const countEl=tg.querySelector('.tg-count');
if(countEl)countEl.textContent=done+'/'+total;
const fillEl=tg.querySelector('.tg-pbar-f');
if(fillEl)fillEl.style.width=pct+'%';
}
}
// Update main progress bar
updateMainProgress();
}
function updateMainProgress(){
const s=sts(),pct=s.t?Math.round(s.d/s.t*100):0;
const pf=document.getElementById('main-pf');
const pl=document.getElementById('main-pl');
if(pf)pf.style.width=pct+'%';
if(pl)pl.textContent=pct+'% — '+s.d+'/'+s.t;
// Update stat cards
const statEls=document.querySelectorAll('.st-n');
if(statEls.length>=4){statEls[0].textContent=pct+'%';statEls[1].textContent=s.d;statEls[2].textContent=s.t-s.d}
}


// Toggle accordion group

// Check/uncheck all items in a group
function checkAllGroup(g,checked){
const items=TD[g];if(!items)return;
items.forEach(i=>{const k=g+'|'+i;if(checked)CK[k]=true;else delete CK[k]});
sv();rT();
}
// Reset all progress
function resetAll(){
if(!confirm('Reset ALL progress? This cannot be undone.'))return;
CK={};
openGroups.clear();
try{localStorage.removeItem('rdr2t')}catch(e){}
try{indexedDB.deleteDatabase('rdr2c')}catch(e){}
if(_db){try{_db.doc('data/users/me/rdr2_save').delete()}catch(e){}}
rT();
document.getElementById('save-code-area').innerHTML='';
alert('All progress reset.');
}

<div id="save-code-area"></div>
<div class="stats"><div class="st"><div class="st-n" id="st-pct">${pct}%</div><div class="st-l">Overall</div></div><div class="st"><div class="st-n" id="st-done">${s.d}</div><div class="st-l">Done</div></div><div class="st"><div class="st-n" id="st-left">${s.t-s.d}</div><div class="st-l">Left</div></div><div class="st"><div class="st-n" id="st-total">${s.t}</div><div class="st-l">Total</div></div></div>
<div class="pbar-w"><div class="pbar-f" id="main-pf" style="width:${pct}%"></div><div class="pbar-l" id="main-pl">${pct}% — ${s.d}/${s.t}</div></div>
<div class="flex-bar"><input class="sbox" id="ts" placeholder="Search tracker…" oninput="rT(true)" style="margin:0"><button class="btn btn-d" onclick="resetAll()">Reset</button></div>
<div id="tracker-items"></div>`;
itemsDiv=document.getElementById('tracker-items');
}else{
// Update stats in-place without touching the search input
const e=id=>document.getElementById(id);
if(e('st-pct'))e('st-pct').textContent=pct+'%';
if(e('st-done'))e('st-done').textContent=s.d;
if(e('st-left'))e('st-left').textContent=s.t-s.d;
if(e('main-pf'))e('main-pf').style.width=pct+'%';
if(e('main-pl'))e('main-pl').textContent=pct+'% — '+s.d+'/'+s.t;
}

// Build only the accordion items
let h='';
for(const[g,its]of Object.entries(TD)){
const fi=its.filter(i=>!filt||i.toLowerCase().includes(filt)||g.toLowerCase().includes(filt));
if(!fi.length)continue;const gs=s.gs[g],gp=gs.t?Math.round(gs.d/gs.t*100):0;
const isOpen=filt||openGroups.has(g);
h+=`<div class="tg ${isOpen?'open':''}" data-g="${esc(g)}"><div class="tg-h" onclick="toggleGroup(this.parentElement,'${escJ(g)}')"><div class="tg-title"><span class="tg-arrow">▶</span>${g}</div><div class="tg-pbar"><div class="tg-pbar-f" style="width:${gp}%"></div></div><span class="tg-count">${gs.d}/${gs.t}</span></div><div class="tg-body"><div style="display:flex;gap:6px;padding:4px 12px 6px;border-bottom:1px solid var(--brd)"><button class="btn" style="font-size:9px;padding:3px 8px" onclick="event.stopPropagation();checkAllGroup('${escJ(g)}',true)">✓ All</button><button class="btn" style="font-size:9px;padding:3px 8px" onclick="event.stopPropagation();checkAllGroup('${escJ(g)}',false)">✗ None</button></div>`;
fi.forEach(i=>{const k=g+'|'+i,dn=CK[k];
h+=`<div class="ci ${dn?'done':''}"><input type="checkbox" ${dn?'checked':''} onchange="toggleCheck('${escJ(k)}',this)"><label>${i}</label><button class="gi" onclick="event.stopPropagation();om('${escJ(i)}',getGuide('${escJ(i)}','${escJ(g)}'))">Guide</button></div>`});
h+=`</div></div>`}
itemsDiv.innerHTML=h;

// Refocus search if this was triggered by typing
if(fromSearch){
const inp=document.getElementById('ts');
if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
}
}

// STORY
const ST=[{t:"Chapter 1 – Colter",i:"🏔️",d:"Snowy tutorial. 6 missions. O'Driscoll camp, Adler rescue."},{t:"Chapter 2 – Horseshoe Overlook",i:"⛺",d:"Open world. Valentine. Hunting, debt collecting, A Quiet Time. ~20 missions."},{t:"Chapter 3 – Clemens Point",i:"🏚️",d:"Lemoyne. Gray–Braithwaite feud. Jack kidnapped. ~14 missions."},{t:"Chapter 4 – Saint Denis",i:"🏙️",d:"Bronte, theater, bank robbery disaster. ~12 missions."},{t:"Chapter 5 – Guarma",i:"🌴",d:"Linear island. Unique animals. Can't return. ~6 missions."},{t:"Chapter 6 – Beaver Hollow",i:"💀",d:"Gang fractures. Arthur's illness. Ending varies by honor. ~16 missions."},{t:"Epilogue 1 – Pronghorn",i:"🌾",d:"John. Ranch work, farming. ~8 missions."},{t:"Epilogue 2 – Beecher's Hope",i:"🏠",d:"Build ranch. Track Micah. American Venom. Free roam + New Austin. ~10 missions."}];
function rS(){let h=`<h1>Story & Missions</h1><p class="sub">Spoiler warning.</p>`;ST.forEach(s=>{h+=`<div class="wc" onclick="this.classList.toggle('open')"><div class="wc-h"><div class="wc-i">${s.i}</div><div class="wc-f"><div class="wc-n">${s.t}</div></div><span class="wc-a">▶</span></div><div class="wc-b"><p>${s.d}</p></div></div>`});document.getElementById('pg-story').innerHTML=h}

// WEAPONS RENDER
function rW(){const filt=(document.getElementById('ws')?document.getElementById('ws').value:'').toLowerCase();
let h=`<h1>Weapons — All ${WP.reduce((a,c)=>a+c.w.length,0)} Weapons</h1><p class="sub">Full compendium. Stats rated /10.</p><input class="sbox" id="ws" placeholder="Search…" oninput="rW(true)" value="${esc(filt)}">`;
WP.forEach(cat=>{const fi=cat.w.filter(w=>!filt||w.n.toLowerCase().includes(filt)||cat.c.toLowerCase().includes(filt));if(!fi.length)return;
h+=`<h2>${cat.i} ${cat.c} (${fi.length})</h2>`;fi.forEach(w=>{h+=`<div class="wc" onclick="this.classList.toggle('open')"><div class="wc-h"><div class="wc-f"><div class="wc-n">${w.n}</div><div class="wc-s">${w.loc}</div></div><span class="wc-a">▶</span></div>
<div class="wc-b">${sbar('Damage',w.dm,10,'#c05040')}${sbar('Range',w.rn,10,'#4090c0')}${sbar('Fire Rate',w.fr,10,'#c0a030')}${sbar('Accuracy',w.ac,10,'#40a050')}${w.rl?sbar('Reload',w.rl,10,'#9070b0'):''}
<div class="divider"></div><p>${w.f}</p></div></div>`})});
document.getElementById('pg-weapons').innerHTML=h;
if(arguments[0]){const inp=document.getElementById('ws');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}}

// ANIMALS RENDER
function rA(){const filt=(document.getElementById('as')?document.getElementById('as').value:'').toLowerCase();
let h=`<h1>Animals — All ${AN.length} Species</h1><p class="sub">Full compendium: 178 animals including legendaries. Location, weapon, drops, uses.</p><div class="cnt">${AN.length} species loaded</div><input class="sbox" id="as" placeholder="Search animals…" oninput="rA(true)" value="${esc(filt)}">`;
const fi=AN.filter(a=>!filt||a.n.toLowerCase().includes(filt)||a.loc.toLowerCase().includes(filt)||a.dr.toLowerCase().includes(filt));
fi.forEach(a=>{const sl={S:'Small',M:'Medium',L:'Large','-':'-'}[a.sz]||a.sz;
const isLeg=a.n.startsWith('Legendary');
h+=`<div class="wc" onclick="this.classList.toggle('open')"><div class="wc-h"><div class="wc-i">${a.i}</div><div class="wc-f"><div class="wc-n">${a.n}</div><div class="wc-s">${a.wp!=='-'?`<span class="tag tag-b">${sl}</span><span class="tag tag-y">${a.wp}</span>`:`<span class="tag tag-p">Study only</span>`}</div></div><span class="wc-a">▶</span></div>
<div class="wc-b"><div class="row"><div class="col"><div class="lbl">Location</div><div class="val">${a.loc}</div></div>${a.wp!=='-'?`<div class="col"><div class="lbl">Perfect pelt</div><div class="val">${a.wp}</div></div>`:''}</div>
${a.dr!=='-'?`<div class="divider"></div><div class="lbl">Drops</div><div class="val">${a.dr}</div>`:''}<div class="lbl" style="margin-top:4px">Uses</div><div class="val">${a.u}</div></div></div>`});
if(!fi.length)h+=`<p style="color:var(--tx2)">No results.</p>`;
document.getElementById('pg-animals').innerHTML=h;
if(arguments[0]){const inp=document.getElementById('as');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}}

// FISH RENDER
function rF(){const filt=(document.getElementById('fs')?document.getElementById('fs').value:'').toLowerCase();
let h=`<h1>Fish — All ${FI.length} Species</h1><p class="sub">15 regular + 15 legendary. Bait, location, and uses.</p><input class="sbox" id="fs" placeholder="Search fish…" oninput="rF(true)" value="${esc(filt)}">`;
const fi=FI.filter(f=>!filt||f.n.toLowerCase().includes(filt)||f.loc.toLowerCase().includes(filt));
fi.forEach(f=>{h+=`<div class="wc" onclick="this.classList.toggle('open')"><div class="wc-h"><div class="wc-i">${f.i}</div><div class="wc-f"><div class="wc-n">${f.n}</div><div class="wc-s">${f.bt}</div></div><span class="wc-a">▶</span></div>
<div class="wc-b"><div class="row"><div class="col"><div class="lbl">Location</div><div class="val">${f.loc}</div></div><div class="col"><div class="lbl">Bait</div><div class="val">${f.bt}</div></div></div>
<div class="divider"></div><div class="lbl">Drops</div><div class="val">${f.dr}</div><div class="lbl" style="margin-top:4px">Notes</div><div class="val">${f.u}</div></div></div>`});
document.getElementById('pg-fish').innerHTML=h;
if(arguments[0]){const inp=document.getElementById('fss');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}}

// PLANTS RENDER
function rP(){const filt=(document.getElementById('ps')?document.getElementById('ps').value:'').toLowerCase();
let h=`<h1>Plants — All ${PL.length} Species</h1><p class="sub">Full compendium: 30 herbs/mushrooms/berries + 13 orchids. Use Eagle Eye to spot.</p><div class="cnt">${PL.length} species loaded</div><input class="sbox" id="ps" placeholder="Search plants…" oninput="rP(true)" value="${esc(filt)}">`;
const fi=PL.filter(p=>!filt||p.n.toLowerCase().includes(filt)||p.loc.toLowerCase().includes(filt)||p.u.toLowerCase().includes(filt)||p.cat.toLowerCase().includes(filt));
const cc={'Health':'tag-r','Dead Eye':'tag-b','Seasoning':'tag-g','Stamina':'tag-g','Poison':'tag-r','Berry':'tag-p','Mushroom':'tag-p','Crafting':'tag-y','Exotic':'tag-y'};
fi.forEach(p=>{h+=`<div class="wc" onclick="this.classList.toggle('open')"><div class="wc-h"><div class="wc-i">${p.i}</div><div class="wc-f"><div class="wc-n">${p.n}</div><div class="wc-s"><span class="tag ${cc[p.cat]||'tag-y'}">${p.cat}</span></div></div><span class="wc-a">▶</span></div>
<div class="wc-b"><div class="row"><div class="col"><div class="lbl">Location</div><div class="val">${p.loc}</div></div><div class="col"><div class="lbl">Category</div><div class="val">${p.cat}</div></div></div>
<div class="divider"></div><div class="lbl">Uses</div><div class="val">${p.u}</div></div></div>`});
document.getElementById('pg-plants').innerHTML=h;
if(arguments[0]){const inp=document.getElementById('ps');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}}

// HORSES RENDER
function rH(){const filt=(document.getElementById('hs')?document.getElementById('hs').value:'').toLowerCase();
let h=`<h1>Horses — All ${HR.length} Breeds</h1><p class="sub">Full compendium. Speed, accel, health, stamina /10.</p><input class="sbox" id="hs" placeholder="Search…" oninput="rH(true)" value="${esc(filt)}">`;
const fi=HR.filter(x=>!filt||x.n.toLowerCase().includes(filt)||x.tm.toLowerCase().includes(filt));
const tc={'Elite':'tag-y','Race':'tag-b','Standard':'tag-p'};const tt={'Brave':'tag-g','Calm':'tag-b','Skittish':'tag-r','Nervous':'tag-r'};
fi.forEach(h2=>{h+=`<div class="wc" onclick="this.classList.toggle('open')"><div class="wc-h"><div class="wc-i">${h2.i}</div><div class="wc-f"><div class="wc-n">${h2.n}</div><div class="wc-s"><span class="tag ${tc[h2.hd]||''}">${h2.hd}</span><span class="tag ${tt[h2.tm]||''}">${h2.tm}</span></div></div><span class="wc-a">▶</span></div>
<div class="wc-b">${sbar('Speed',h2.sp,10,'#c0a030')}${sbar('Accel',h2.ac,10,'#e08030')}${sbar('Health',h2.hp,10,'#c05040')}${sbar('Stamina',h2.st,10,'#40a050')}
<div class="divider"></div><div class="lbl">Where</div><div class="val">${h2.loc}</div><p style="margin-top:6px">${h2.nt}</p></div></div>`});
document.getElementById('pg-horses').innerHTML=h;
if(arguments[0]){const inp=document.getElementById('hs');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}}

// CRAFTING
function rC(){let h=`<h1>Crafting Recipes</h1><p class="sub">Cooking, tonics, ammo, trinkets, satchels.</p>`;
h+=`<h2>🍖 Seasoned Meats</h2><p style="font-size:11px;color:var(--tx2);margin-bottom:8px">Meat + seasoning herb → gold core food. Best food in game.</p>`;
[{m:"Big Game",s:"Bears, elk, gators, wolves"},{m:"Venison",s:"Deer, pronghorn"},{m:"Pork",s:"Boar, pig, peccary"},{m:"Poultry",s:"Turkey, duck, goose"},{m:"Flaky Fish",s:"Trout, salmon, bluegill"},{m:"Gritty Fish",s:"Bass, catfish, gar"},{m:"Stringy",s:"Rabbit, squirrel, raccoon"},{m:"Exotic",s:"Iguana, turtle, gila"}].forEach(mt=>{
h+=`<div class="recipe"><div class="recipe-n">${mt.m} Meat</div><div class="recipe-i">Source: ${mt.s}</div><div class="recipe-e">+ Oregano → Gold Health | + Thyme → Gold Dead Eye | + Mint → Gold Stamina</div></div>`});
h+=`<div class="tip good">Thyme + Big Game = best food. Gold Dead Eye core + fortifies all cores.</div>`;
h+=`<h2>🧪 Tonics</h2>`;
[{n:"Health Cure",g:"Yarrow + Ginseng",e:"Restores Health."},{n:"Potent Health Cure",g:"Yarrow + Ginseng + Burdock Root",e:"Full restore + fortify Health."},{n:"Special Health Cure",g:"Yarrow + Ginseng + Burdock + Feverfew + Snowdrop + Hummingbird Sage",e:"Best health tonic. Pamphlet."},{n:"Snake Oil",g:"Indian Tobacco",e:"Restores Dead Eye."},{n:"Potent Snake Oil",g:"Indian Tobacco + Sage",e:"Full restore + fortify Dead Eye."},{n:"Special Snake Oil",g:"Indian Tobacco + Sage + English Mace + Prairie Poppy",e:"Best Dead Eye tonic. Pamphlet."},{n:"Miracle Tonic",g:"Yarrow + Indian Tobacco + Sage",e:"Restores all 3 cores."},{n:"Potent Miracle Tonic",g:"Yarrow + Indian Tobacco + Sage + Ginseng + Milkweed",e:"Fortifies all 3. Pamphlet."},{n:"Special Miracle Tonic",g:"+ Agarita (New Austin)",e:"Best tonic. Pamphlet + epilogue herb."},{n:"Cover Scent Lotion",g:"Scent Gland + Creeping Thyme",e:"Masks scent from animals."},{n:"Horse Health Cure",g:"Yarrow + Ginseng",e:"Restores horse health."},{n:"Horse Stimulant",g:"Burdock Root",e:"Restores horse stamina."}].forEach(t=>{h+=`<div class="recipe"><div class="recipe-n">${t.n}</div><div class="recipe-i">${t.g}</div><div class="recipe-e">${t.e}</div></div>`});
h+=`<h2>🎯 Ammo Crafting</h2>`;
[{n:"Improved Arrows",g:"Arrow + Flight Feather",e:"Higher damage. Large game."},{n:"Small Game Arrows",g:"Arrow + Flight Feather + Shotgun Shell",e:"Tiny animals. Perfect pelts."},{n:"Poison Arrows",g:"Arrow + Flight Feather + Oleander Sage",e:"Kills over time. No pelt damage."},{n:"Fire Arrows",g:"Arrow + Flight Feather + Animal Fat",e:"Incendiary."},{n:"Dynamite Arrows",g:"Arrow + Flight Feather + Dynamite",e:"Explosive. Destroys pelts."},{n:"Explosive Rounds",g:"Express Ammo + Animal Fat",e:"Devastating. Anti-legendary. Pamphlet."},{n:"Incendiary Buckshot",g:"Shotgun Shell + Moonshine",e:"Fire shotgun rounds. Pamphlet."},{n:"Fire Bottle",g:"Animal Fat + Moonshine",e:"Molotov cocktail."},{n:"Tomahawk",g:"Hatchet + Flight Feather",e:"Throwable melee."},{n:"Poison Throwing Knife",g:"Throwing Knife + Oleander Sage",e:"Silent DOT kill."}].forEach(a=>{h+=`<div class="recipe"><div class="recipe-n">${a.n}</div><div class="recipe-i">${a.g}</div><div class="recipe-e">${a.e}</div></div>`});
h+=`<h2>🏆 Trinkets & Talismans</h2><p style="font-size:11px;color:var(--tx2);margin-bottom:8px">Craft at Fence from legendary parts. Permanent passive bonuses.</p>`;
[{n:"Buck Antler Trinket",g:"Leg. Buck Antler + Cobalt Petrified Wood",e:"★ Improves pelt quality. GET FIRST."},{n:"Wolf Heart Trinket",g:"Leg. Wolf Heart + Cobalt Petrified Wood",e:"★ Doubles skinning yield."},{n:"Bear Claw Talisman",g:"Leg. Bear Claw + Silver Chain Bracelet + Quartz",e:"Reduces damage 10%."},{n:"Boar Tusk Talisman",g:"Leg. Boar Tusk + Cobalt PW + Gold Earring",e:"Slows core drain 10%."},{n:"Beaver Tooth Trinket",g:"Leg. Beaver Tooth + Cobalt PW",e:"Slows weapon degradation."},{n:"Elk Antler Trinket",g:"Leg. Elk Antler + Cobalt PW",e:"Stamina XP +10%."},{n:"Coyote Fang Trinket",g:"Leg. Coyote Fang + Cobalt PW",e:"Dead Eye XP +10%."},{n:"Fox Claw Trinket",g:"Leg. Fox Claw + Cobalt PW",e:"Eagle Eye duration up."},{n:"Ram Horn Trinket",g:"Leg. Ram Horn + Cobalt PW",e:"Melee damage reduction."},{n:"Panther Eye Trinket",g:"Leg. Panther Eye + Cobalt PW",e:"Dead Eye drain -10%. Requires MH10."},{n:"Bison Horn Talisman",g:"Leg. Bison Horn + Cobalt PW + Silver Earring",e:"Bow stamina drain reduced."},{n:"Alligator Tooth Talisman",g:"Leg. Gator Tooth + Gold Jointed Bracelet + Vintage Watch",e:"Reduces Dead Eye drain."}].forEach(t=>{h+=`<div class="recipe"><div class="recipe-n">${t.n}</div><div class="recipe-i">${t.g}</div><div class="recipe-e">${t.e}</div></div>`});
h+=`<h2>👜 Satchel Upgrades (Pearson)</h2>`;
[{n:"Tonics Satchel",g:"Perfect Deer Pelt + Perfect Buck Pelt",e:"Carry more tonics."},{n:"Ingredients Satchel",g:"Perfect Deer Pelt + Perfect Badger Pelt",e:"Carry more ingredients."},{n:"Kit Satchel",g:"Perfect Elk Pelt + Perfect Panther Pelt",e:"Carry more kits."},{n:"Provisions Satchel",g:"Perfect Deer Pelt + Perfect Bison Pelt",e:"Carry more food."},{n:"Materials Satchel",g:"Perfect Boar Pelt + Perfect Iguana Skin",e:"Carry more materials."},{n:"Valuables Satchel",g:"Perfect Beaver Pelt + Perfect Rabbit Pelt",e:"Carry more valuables."},{n:"Legend of the East",g:"All 6 satchels completed",e:"★ Carry 99 of EVERYTHING. Top priority."}].forEach(s=>{h+=`<div class="recipe"><div class="recipe-n">${s.n}</div><div class="recipe-i">${s.g}</div><div class="recipe-e">${s.e}</div></div>`});
document.getElementById('pg-crafting').innerHTML=h}

// TIPS
function rTi(){let h=`<h1>Tips & Mechanics</h1><p class="sub">Essential gameplay systems.</p>`;
[{t:"Making Money",i:"💰",d:"Free gold bar at Limpany ($500). Treasure maps: Jack Hall Gang, High Stakes, Poisonous Trail, Elemental Trail. Each chain → gold bars. Loot bodies, sell at Fence."},{t:"Honor",i:"⚖️",d:"High: 50% discounts, best ending, outfits. Raise: greet NPCs, chores, help strangers, catch-release fish. Capped until Ch6."},{t:"Dead Eye",i:"👁️",d:"Manual → auto-marking → critical points. Refill: chewing tobacco, snake oil, cooked meats."},{t:"Camp",i:"🏕️",d:"Buy fast travel map first. Legend of the East satchel = carry 99 of everything."},{t:"Horses",i:"🐴",d:"Feed, brush, pat → Level 4 bond. Keep Horse Reviver. Horses die permanently."},{t:"Wanted",i:"🚨",d:"Bandana reduces ID. Pay at post offices. $100+ = bounty hunters."},{t:"Tricks",i:"🎩",d:"Save before legendaries. Replay for gold medals. Photo Mode scouts. First-person looting faster. Sleep to change spawn time."}].forEach(t=>{
h+=`<div class="wc" onclick="this.classList.toggle('open')"><div class="wc-h"><div class="wc-i">${t.i}</div><div class="wc-f"><div class="wc-n">${t.t}</div></div><span class="wc-a">▶</span></div><div class="wc-b"><p>${t.d}</p></div></div>`});
document.getElementById('pg-tips').innerHTML=h}

// INIT
// Render immediately with localStorage data
rT();rS();rW();rA();rF();rP();rH();rC();rTi();
// Then async-load from IndexedDB and cloud for better data
loadProgress().then(()=>{rT()}).catch(()=>{});
</script>

.fab-modal textarea:focus{border-color:var(--ac);outline:none}
.fab-btn-primary{
width:100%;margin-top:10px;padding:14px;font-size:15px;font-weight:700;
border-radius:12px;border:none;cursor:pointer;
background:linear-gradient(135deg,#c8a24e,#a67c2e);color:#fff;
box-shadow:0 4px 14px rgba(200,162,78,.3);
transition:transform .12s;
}
.fab-btn-primary:active{transform:scale(.97)}
.fab-btn-secondary{
width:100%;margin-top:8px;padding:12px;font-size:14px;
border-radius:12px;border:1.5px solid var(--brd);
background:none;color:var(--t2);cursor:pointer;
}
</style>
<style>
#fab-bar~*{padding-bottom:0!important}
#pg-tracker,#pg-story,#pg-weapons,#pg-animals,#pg-fish,#pg-plants,#pg-horses,#pg-crafting,#pg-tips{padding-bottom:70px!important}
</style>
<script>
// Show floating bar only on tracker page
function updateFab(){
const onTracker=document.getElementById('pg-tracker')&&document.getElementById('pg-tracker').style.display!=='none';
document.getElementById('fab-bar').style.display=onTracker?'flex':'none';
}
// Hook into page navigation
const origNav=nav;
nav=function(p){origNav(p);updateFab()};
setTimeout(updateFab,100);

function toast(msg,color){
const t=document.getElementById('fab-toast');
t.textContent=msg;
t.style.background=color||'rgba(42,119,85,.92)';
t.style.color='#fff';
t.classList.remove('show');
void t.offsetWidth;
t.classList.add('show');
clearTimeout(t._timer);
t._timer=setTimeout(()=>{t.classList.remove('show')},2400);
}

function fabSave(){
const code=encodeProgress();
const count=Object.keys(CK).filter(k=>CK[k]).length;
if(count===0){toast('No items checked yet!','#888');return}
// Try clipboard
navigator.clipboard.writeText(code).then(()=>{
toast('✅ '+count+' items saved to clipboard!','#2a7');
}).catch(()=>{
// Fallback: show code to manually copy
showOverlay(`
<h3>Save Code</h3>
<p>${count} items checked. Copy this code and keep it safe:</p>
<textarea id="manual-code" readonly>${code}</textarea>
<button onclick="document.getElementById('manual-code').select();document.execCommand('copy');toast('✅ Copied!');hideOverlay()" class="fab-btn-primary">📋 Copy Code</button>
<button onclick="hideOverlay()" class="fab-btn-secondary">Cancel</button>
`);
});
}

function fabLoad(){
// Try clipboard first
navigator.clipboard.readText().then(text=>{
if(text&&text.startsWith('RDR2:')){
const result=decodeProgress(text);
if(result){
const count=Object.keys(result).filter(k=>result[k]).length;
CK=result;sv();rT();
toast('✅ Restored '+count+' items!','#2a7');
return;
}
}
// Clipboard didn't have valid data
showPasteUI();
}).catch(()=>{
showPasteUI();
});
}

function showPasteUI(){
showOverlay(`
<h3>Load Progress</h3>
<p>Paste your save code below:</p>
<textarea id="paste-area" placeholder="Paste RDR2:... code here"></textarea>
<button onclick="doRestore()" class="fab-btn-primary">📥 Restore</button>
<button onclick="hideOverlay()" class="fab-btn-secondary">Cancel</button>
`);
setTimeout(()=>{const ta=document.getElementById('paste-area');if(ta)ta.focus()},200);
}

function doRestore(){
const ta=document.getElementById('paste-area');
if(!ta||!ta.value.trim())return;
const result=decodeProgress(ta.value.trim());
if(result){
const count=Object.keys(result).filter(k=>result[k]).length;
CK=result;sv();rT();
hideOverlay();
toast('✅ Restored '+count+' items!','#2a7');
}else{
toast('❌ Invalid code','#c44');
}
}

function showOverlay(html){
const o=document.getElementById('fab-overlay');
document.getElementById('fab-overlay-content').innerHTML=html;
o.style.display='flex';
o.onclick=e=>{if(e.target===o)hideOverlay()};
}
function hideOverlay(){document.getElementById('fab-overlay').style.display='none'}

// On load: auto-try to restore from clipboard (requires user tap on iOS)
// Show a restore prompt if localStorage is empty and user might have data
setTimeout(()=>{
const count=Object.keys(CK).filter(k=>CK[k]).length;
if(count===0){
// Try reading from artifact db
tryDbLoad();
}
},500);

async function tryDbLoad(){
let attempts=0;
const tryOnce=async()=>{
try{
if(typeof window.claude==='undefined'||!window.claude.use){
if(attempts<30){attempts++;setTimeout(tryOnce,500);return}
return;
}
const db=await window.claude.use('db');
if(!db)return;
const snap=await db.doc('data/users/me/rdr2_save').get();
if(snap.exists){
const d=snap.data();
if(d.progress&&d.progress!=='{}'){
const parsed=JSON.parse(d.progress);
const count=Object.keys(parsed).filter(k=>parsed[k]).length;
if(count>0){
CK=parsed;sv();rT();
toast('☁️ Loaded '+count+' items from cloud!','#2a7');
}
}
}
}catch(e){}
};
tryOnce();
}
</script>
</body>
</html>
